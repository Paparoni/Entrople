name: Update today's Wordle answer

on:
  schedule:
    # A single cron fire at 4:01/5:01 UTC (the two possible Eastern
    # midnights) is best-effort only -- GitHub explicitly documents that
    # scheduled workflows can be delayed, especially for low-traffic public
    # repos when the scheduler queue is backed up. This repo has seen a fire
    # land 4+ hours late. Rather than chase a single on-time shot, this runs
    # every 15 minutes across a 5-hour window covering both possible
    # midnights plus slack (4:00-8:59 UTC = 12:00am-4:59am EDT /
    # 11:00pm-3:59am EST). Each run is a near-instant no-op once the archive
    # already has today's date (see scripts/update-wordle.mjs), so the extra
    # runs cost a few seconds of free public-repo Actions time, not
    # meaningfully more.
    - cron: "*/15 4-8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# With runs firing every 15 minutes for 5 hours, overlap is expected (a run
# that takes a bit longer than usual can still be going when the next one
# starts). Queue instead of cancel so a slow run finishes and commits, and
# pull --rebase (below) means a normal overlap doesn't fail as
# non-fast-forward.
concurrency:
  group: update-wordle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch today's Wordle answer
        run: node scripts/update-wordle.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wordle-answers.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Wordle archive"

          # Pull in any commits that landed on main since checkout (e.g. an
          # overlapping run that finished first) before pushing, so a normal
          # race doesn't fail as non-fast-forward.
          git pull --rebase origin main

          if ! git push; then
            echo "::error::Push failed. If the error above mentions 403 or " \
                 "'permission denied', go to Settings > Actions > General > " \
                 "Workflow permissions on this repo and set it to " \
                 "'Read and write permissions' -- the 'permissions: contents: " \
                 "write' block in this workflow file can't override a " \
                 "repo/org setting that forces read-only tokens."
            exit 1
          fi
