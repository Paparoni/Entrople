name: Update today's Wordle answer

on:
  schedule:
    # Runs at both possible Eastern midnights (4:01am UTC = midnight EDT,
    # 5:01am UTC = midnight EST) so it fires within a minute of local
    # midnight year-round without manual DST changes. The script skips
    # the fetch if it already has today's date, so the extra run is a no-op.
    - cron: "1 4,5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Scheduled triggers can occasionally run late; without this, an overlapping
# 4:01/5:01 pair (or a manual dispatch landing mid-run) could race on the
# same file and have one push get rejected as non-fast-forward. Queue them
# instead of cancelling, so a slow run still gets to finish and commit.
concurrency:
  group: update-wordle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch today's Wordle answer
        run: node scripts/update-wordle.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wordle-answers.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Wordle archive"

          # Pull in any commits that landed on main since checkout (e.g. an
          # overlapping run that finished first) before pushing, so a normal
          # race doesn't fail as non-fast-forward.
          git pull --rebase origin main

          if ! git push; then
            echo "::error::Push failed. If the error above mentions 403 or " \
                 "'permission denied', go to Settings > Actions > General > " \
                 "Workflow permissions on this repo and set it to " \
                 "'Read and write permissions' -- the 'permissions: contents: " \
                 "write' block in this workflow file can't override a " \
                 "repo/org setting that forces read-only tokens."
            exit 1
          fi
