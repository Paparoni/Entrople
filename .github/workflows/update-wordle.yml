name: Update today's Wordle answer

on:
  schedule:
    # 06:00 UTC is after midnight Eastern year-round (01:00 EST / 02:00 EDT),
    # so the NYT date has always rolled over by the time this runs.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch today's Wordle answer
        run: node scripts/update-wordle.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wordle-answers.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Wordle archive"
            git push
          fi
